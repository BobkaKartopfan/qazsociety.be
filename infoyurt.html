          "\u041e\u043d\u044b\u04a3 \u049b\u04b1\u0440\u044b\u043b\u044b\u043c\u044b \u0430\u0493\u0430\u0448 \u049b\u0430\u04a3\u049b\u0430\u0434\u0430\u043d (\u043a\u0435\u0440\u0435\u0433\u0435, \u0443\u044b\u049b) \u0436\u04d9\u043d\u0435 \u0448\u0430\u04a3\u044b\u0440\u0430\u049b \u0434\u0435\u043f \u0430\u0442\u0430\u043b\u0430\u0442\u044b\u043d \u043e\u0440\u0442\u0430\u043b\u044b\u049b \u0448\u0435\u04a3\u0431\u0435\u0440\u0434\u0435\u043d \u0442\u04b1\u0440\u0430\u0434\u044b, \u043e\u043b \u04af\u0439\u0434\u0456, \u043e\u0442\u0431\u0430\u0441\u044b\u043d\u044b \u0436\u04d9\u043d\u0435 \u04b1\u0440\u043f\u0430\u049b\u0442\u0430\u0440 \u0441\u0430\u0431\u0430\u0493\u0430\u0441\u0442\u044b\u0493\u044b\u043d \u0431\u0435\u0439\u043d\u0435\u043b\u0435\u0439\u0434\u0456.",

          "\u00c0 l'ext\u00e9rieur, la yourte est recouverte de feutre en laine de mouton, qui prot\u00e8ge du froid en hiver et conserve la fra\u00eecheur en \u00e9t\u00e9.",
          "La yourte n'est pas seulement une habitation, c'est aussi un symbole important de la culture, des traditions et de l'hospitalit\u00e9 du peuple kazakh."
        ]

      nl: {
        label: "Dutch",
        paragraphs: [
          "Welkom!",
          "Voor u staat een joert, de traditionele woning van de nomadische volkeren van Kazachstan, opgesteld in de Ambassade van Kazachstan in Belgi\u00eb.",
          "De joert werd eeuwenlang gebruikt in de steppen van Centraal-Azi\u00eb en was perfect geschikt voor de nomadische levenswijze: ze is gemakkelijk op te bouwen, af te breken en te vervoeren.",

      }

    const select = document.getElementById("language-select");
    const label = document.getElementById("translation-label");
    const content = document.getElementById("translation-content");

    function renderTranslation(language) {
      const entry = translations[language] || translations.en;
      label.textContent = entry.label;
      content.innerHTML = "";

      entry.paragraphs.forEach((paragraph) => {
        const p = document.createElement("p");
        p.textContent = paragraph;
        content.appendChild(p);
      });

      document.documentElement.lang = language;
    }

    select.addEventListener("change", (event) => {
      renderTranslation(event.target.value);
    });

    renderTranslation("en");
  </script>
