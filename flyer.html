<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Program List</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #13325b;
      background: #f3f7fb;
    }

    .flyer-toolbar {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid #d6e2f0;
      background: rgba(255, 255, 255, 0.96);
    }

    .flyer-toolbar h1 {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.2;
    }

    .language-picker {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #527199;
    }

    .language-picker select {
      min-width: 170px;
      padding: 10px 12px;
      border: 1px solid #d6e2f0;
      border-radius: 8px;
      background: #fff;
      color: #13325b;
      font: inherit;
    }

    .flyer-view {
      display: block;
      width: min(100%, 1684px);
      height: auto;
      margin: 0 auto;
      background: #fff;
    }

    @media (max-width: 640px) {
      .flyer-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .language-picker {
        align-items: stretch;
        flex-direction: column;
      }

      .language-picker select {
        width: 100%;
      }

      .flyer-view {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="flyer-toolbar">
    <h1>Program List</h1>
    <label class="language-picker" for="flyer-language">
      <span>Language</span>
      <select id="flyer-language" aria-label="Select flyer language">
        <option value="full" selected>Map</option>
        <option value="en">English</option>
        <option value="kk">Kazakh</option>
      </select>
    </label>
  </header>

  <main>
    <img
      id="flyer-image"
      class="flyer-view"
      src="images/11thAprilMAP.png"
      alt="11 April map"
    >
  </main>

  <script>
    const flyers = {
      full: {
        lang: "en",
        path: "images/11thAprilMAP.png",
        alt: "11 April map"
      },
      en: {
        lang: "en",
        path: "images/ListENG.png",
        alt: "11 April English program list"
      },
      kk: {
        lang: "kk",
        path: "images/ListKAZ.png",
        alt: "11 April Kazakh program list"
      }
    };

    const select = document.getElementById("flyer-language");
    const image = document.getElementById("flyer-image");

    select.addEventListener("change", (event) => {
      const flyer = flyers[event.target.value] || flyers.full;
      image.src = flyer.path;
      image.alt = flyer.alt;
      document.documentElement.lang = flyer.lang;
    });
  </script>
</body>
</html>
